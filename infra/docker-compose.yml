services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squadra}
      POSTGRES_USER: ${POSTGRES_USER:-squadra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squadra_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - squadra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-squadra}
      POSTGRES_USER: ${POSTGRES_USER:-squadra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squadra_local_only}
      # Development-only fallback. Set JWT_SIGNING_KEY in .env for a stable local secret.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-squadra-local-development-signing-key-change-before-production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SMTP_HOST: mailpit
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      SQUADRA_API_URL: ${SQUADRA_API_URL:-http://api:8080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-squadra-local-nextauth-secret-change-before-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  squadra-postgres:
