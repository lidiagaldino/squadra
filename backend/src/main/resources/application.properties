quarkus.http.port=${API_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${WEB_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:squadra}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:squadra}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=squadra
quarkus.flyway.create-schemas=true
quarkus.jackson.fail-on-unknown-properties=true

# Intentionally has no default: deployments must supply signing material externally.
squadra.identity.signing-key=${JWT_SIGNING_KEY}
squadra.identity.jwt-issuer=${JWT_ISSUER:squadra-api}
squadra.identity.access-token-lifetime-seconds=${ACCESS_TOKEN_LIFETIME_SECONDS:900}
squadra.identity.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/password-reset}

# Mailpit defaults are local-development only. Production must provide its SMTP host and credentials.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.from=${SMTP_FROM:no-reply@squadra.local}
quarkus.mailer.start-tls=DISABLED

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:squadra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=true
%test.squadra.identity.signing-key=test-only-signing-key-not-for-deployment
